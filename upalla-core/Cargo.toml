[package]
name = "upalla-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "GPU-agnostic real-time noise suppression engine using DeepFilterNet3"

[dependencies]
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }
rustfft = { version = "6", features = ["avx", "sse"] }
realfft = "3"
ndarray = "0.16"
anyhow = "1"
bytemuck = "1"
log = "0.4"
thiserror = "2"
