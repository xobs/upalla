[package]
name = "upalla-pw"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Standalone PipeWire filter for Upalla noise suppression"

[[bin]]
name = "upalla"
path = "src/main.rs"

[dependencies]
upalla-core = { path = "../upalla-core" }
df = { package = "deep_filter", path = "../../DeepFilterNet/libDF", features = ["tract", "default-model-ll"] }
ndarray = "0.17"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
ctrlc = "3"
libloading = "0.8"
crossbeam-queue = "0.3"
hound = "3"

[build-dependencies]
cc = "1"
