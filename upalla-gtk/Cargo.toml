[package]
name = "upalla-gtk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "GTK4 GUI for Upalla noise suppression"

[dependencies]
upalla-core = { path = "../upalla-core" }
upalla-pa = { path = "../upalla-pa" }
gtk4 = { version = "0.11", features = ["v4_22"] }
ksni = { version = "0.3", features = ["blocking"] }
crossbeam-channel = "0.5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
