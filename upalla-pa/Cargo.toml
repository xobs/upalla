[package]
name = "upalla-pa"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "PulseAudio filter for Upalla noise suppression"

[[bin]]
name = "upalla-pa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
ctrlc = "3"
env_logger = "0.11"
log = "0.4"
upalla-core = { path = "../upalla-core" }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"
ringbuf = "0.4"