<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <defs>
    <!-- Calm background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c5c"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>

    <!-- Soft glow behind microphone -->
    <radialGradient id="micGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ecfcf" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7ecfcf" stop-opacity="0"/>
    </radialGradient>

    <!-- Circular clip for perfect round icon -->
    <clipPath id="circleClip">
      <circle cx="64" cy="64" r="60"/>
    </clipPath>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Base background -->
    <rect width="128" height="128" fill="url(#bgGrad)"/>

    <!-- Ambient glow -->
    <circle cx="64" cy="55" r="38" fill="url(#micGlow)"/>

    <!-- Layered ocean waves -->
    <!-- Back wave (deepest, darkest) -->
    <path d="M -10,66 C 28,61 42,80 64,74 C 86,68 102,80 138,76 L 138,128 L -10,128 Z" fill="#1a4a5e" opacity="0.7"/>
    
    <!-- Middle wave -->
    <path d="M -10,78 C 32,74 46,92 64,86 C 82,80 96,92 138,88 L 138,128 L -10,128 Z" fill="#2a6b7f" opacity="0.6"/>
    
    <!-- Front wave (lightest, closest) -->
    <path d="M -10,90 C 36,86 50,102 64,97 C 78,92 92,102 138,98 L 138,128 L -10,128 Z" fill="#3d8c9e" opacity="0.5"/>

    <!-- Wave crest highlights -->
    <path d="M 22,83 C 38,79 52,94 64,89 C 76,84 90,94 116,90" fill="none" stroke="#7ecfcf" stroke-width="1.3" opacity="0.45" stroke-linecap="round"/>
    <path d="M 28,95 C 42,91 56,104 64,100 C 72,96 86,104 112,100" fill="none" stroke="#7ecfcf" stroke-width="0.9" opacity="0.35" stroke-linecap="round"/>

    <!-- Microphone -->
    <!-- Mic capsule -->
    <rect x="53" y="28" width="22" height="36" rx="11" ry="11" fill="#e8f4f8" stroke="#ffffff" stroke-width="0.75"/>
    
    <!-- Grill lines -->
    <line x1="58" y1="34" x2="70" y2="34" stroke="#7ecfcf" stroke-width="0.75" opacity="0.55" stroke-linecap="round"/>
    <line x1="58" y1="39" x2="70" y2="39" stroke="#7ecfcf" stroke-width="0.75" opacity="0.55" stroke-linecap="round"/>
    <line x1="58" y1="44" x2="70" y2="44" stroke="#7ecfcf" stroke-width="0.75" opacity="0.55" stroke-linecap="round"/>
    <line x1="58" y1="49" x2="70" y2="49" stroke="#7ecfcf" stroke-width="0.75" opacity="0.55" stroke-linecap="round"/>
    <line x1="58" y1="54" x2="70" y2="54" stroke="#7ecfcf" stroke-width="0.75" opacity="0.55" stroke-linecap="round"/>
    
    <!-- Mic neck -->
    <rect x="61" y="64" width="10" height="26" rx="2" ry="2" fill="#e8f4f8" stroke="#ffffff" stroke-width="0.75"/>
    
    <!-- Mic base -->
    <rect x="57" y="88" width="18" height="6" rx="3" ry="3" fill="#9ec5d0" stroke="#ffffff" stroke-width="0.75"/>
    
    <!-- Stand ring -->
    <circle cx="64" cy="98" r="8" fill="none" stroke="#b0d4de" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Outer border accent -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="#7ecfcf" stroke-width="0.75" opacity="0.35"/>
</svg>
