<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <defs>
    <!-- Calm background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c5c"/>
      <stop offset="100%" stop-color="#0b2545"/>
    </linearGradient>

    <!-- Subtle inner glow -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </radialGradient>

    <!-- Microphone body gradient -->
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="100%" stop-color="#b0d4de"/>
    </linearGradient>

    <!-- Wave fade gradient -->
    <linearGradient id="waveFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ecfcf" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7ecfcf" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7ecfcf" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Clip for round icon -->
    <clipPath id="circleClip">
      <circle cx="64" cy="64" r="60"/>
    </clipPath>
  </defs>

  <!-- Base circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)"/>

  <!-- Subtle inner glow overlay -->
  <circle cx="64" cy="64" r="60" fill="url(#innerGlow)"/>

  <!-- Outer ring accent -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#7ecfcf" stroke-width="0.5" opacity="0.3"/>

  <!-- Noise wave lines being filtered — left side, fading toward center -->
  <g clip-path="url(#circleClip)">
    <!-- Left outer waves (noise) -->
    <path d="M18,54 Q24,44 18,34" fill="none" stroke="#5aa8b4" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    <path d="M14,54 Q22,42 14,30" fill="none" stroke="#5aa8b4" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
    <path d="M22,54 Q28,46 22,38" fill="none" stroke="#5aa8b4" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

    <!-- Left inner waves (smaller, being suppressed) -->
    <path d="M28,54 Q33,47 28,41" fill="none" stroke="#7ecfcf" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M33,54 Q37,49 33,44" fill="none" stroke="#7ecfcf" stroke-width="1" stroke-linecap="round" opacity="0.35"/>

    <!-- Right outer waves (noise) -->
    <path d="M110,54 Q104,44 110,34" fill="none" stroke="#5aa8b4" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
    <path d="M114,54 Q106,42 114,30" fill="none" stroke="#5aa8b4" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
    <path d="M106,54 Q100,46 106,38" fill="none" stroke="#5aa8b4" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

    <!-- Right inner waves (smaller, being suppressed) -->
    <path d="M100,54 Q95,47 100,41" fill="none" stroke="#7ecfcf" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M95,54 Q91,49 95,44" fill="none" stroke="#7ecfcf" stroke-width="1" stroke-linecap="round" opacity="0.35"/>

    <!-- Bottom wave — gentle, calm -->
    <path d="M44,88 Q64,96 84,88" fill="none" stroke="#7ecfcf" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
    <path d="M50,94 Q64,100 78,94" fill="none" stroke="#7ecfcf" stroke-width="1" stroke-linecap="round" opacity="0.2"/>
  </g>

  <!-- Microphone — centered -->
  <g>
    <!-- Mic head (capsule) -->
    <rect x="53" y="30" width="22" height="36" rx="11" ry="11"
          fill="url(#micGrad)" stroke="#ffffff" stroke-width="0.75"/>

    <!-- Grill lines on mic head -->
    <line x1="58" y1="36" x2="70" y2="36" stroke="#7ecfcf" stroke-width="0.75" opacity="0.5" stroke-linecap="round"/>
    <line x1="58" y1="41" x2="70" y2="41" stroke="#7ecfcf" stroke-width="0.75" opacity="0.5" stroke-linecap="round"/>
    <line x1="58" y1="46" x2="70" y2="46" stroke="#7ecfcf" stroke-width="0.75" opacity="0.5" stroke-linecap="round"/>
    <line x1="58" y1="51" x2="70" y2="51" stroke="#7ecfcf" stroke-width="0.75" opacity="0.5" stroke-linecap="round"/>
    <line x1="58" y1="56" x2="70" y2="56" stroke="#7ecfcf" stroke-width="0.75" opacity="0.5" stroke-linecap="round"/>

    <!-- Mic body (neck) -->
    <rect x="61" y="66" width="10" height="22" rx="2" ry="2"
          fill="url(#micGrad)" stroke="#ffffff" stroke-width="0.75"/>

    <!-- Mic base / connector -->
    <rect x="57" y="86" width="18" height="6" rx="3" ry="3"
          fill="#9ec5d0" stroke="#ffffff" stroke-width="0.75"/>

    <!-- Mic stand circle (base ring) -->
    <circle cx="64" cy="98" r="8" fill="none" stroke="#b0d4de" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Soft center glow behind microphone for depth -->
  <circle cx="64" cy="58" r="24" fill="#7ecfcf" opacity="0.06"/>
</svg>
