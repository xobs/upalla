# PipeWire filter-chain configuration for Upalla noise suppression.
#
# RECOMMENDED: Use the native filter binary instead:
#   cargo build -p upalla-pw --release
#   ./target/release/upalla
#
# This creates a "Upalla Denoiser" audio source that you can route
# your microphone through. No config files needed.
#
# --- Alternative: LV2 plugin (requires PipeWire with LV2 support) ---
#   1. Build the LV2 plugin:   cargo build -p upalla-lv2 --release
#   2. Install models:         ./scripts/download-model.sh
#   3. Install LV2 bundle:     ./scripts/install-lv2.sh
#   4. Find the LV2 URI:       lv2ls | grep -i upalla
#   5. Update the "plugin" line below with the correct URI
#   6. Uncomment this block
#   7. cp config/upalla.conf ~/.config/pipewire/pipewire.conf.d/99-upalla.conf
#   8. systemctl restart --user pipewire

