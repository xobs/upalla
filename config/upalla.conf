# PipeWire filter-chain configuration for Upalla noise suppression
#
# Install: copy to ~/.config/pipewire/pipewire.conf.d/99-upalla.conf
# Restart: systemctl restart --user pipewire
#
# The Upalla LV2 plugin must be installed first:
#   cargo truce install --lv2 --dest ~/.lv2/

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Upalla Denoiser"
      media.name = "Upalla Denoiser"
      filter.graph = {
        nodes = [
          {
            type = lv2
            name = upalla
            plugin = "https://github.com/upalla/upalla#denoiser"
            control = {
              "Suppression" = 80.0
              "VAD Threshold" = 50.0
            }
          }
        ]
      }
      capture.props = {
        node.name = "capture.upalla"
        node.passive = true
        audio.rate = 48000
      }
      playback.props = {
        node.name = "upalla_source"
        media.class = "Audio/Source"
        audio.rate = 48000
      }
    }
  }
]
